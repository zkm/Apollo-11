<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo 11 AGC Source</title>
<meta name="description" content="Read the Apollo 11 Guidance Computer source code for the Command Module (Comanche055) and Lunar Module (Luminary099).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9a441'/%3E%3Ccircle cx='11' cy='12' r='2.5' fill='%23b07f22'/%3E%3Ccircle cx='20' cy='19' r='3.5' fill='%23b07f22'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --panel-2: #efede6;
  --line: #dcd8cc;
  --text: #1d232b;
  --muted: #5f6873;
  --accent: #a8740f;
  --accent-soft: #f3e5c4;
  --link: #1f5fa8;
  --c-comment: #6b7480;
  --c-note: #8a5a00;
  --c-label: #1f5fa8;
  --c-op: #8f2f6b;
  --c-arg: #1d232b;
  --c-num: #2c7a4b;
  --hl: #fff2c9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015;
    --panel: #131820;
    --panel-2: #1a2029;
    --line: #262e3a;
    --text: #d8dee6;
    --muted: #8994a2;
    --accent: #e0ae4a;
    --accent-soft: #2e2716;
    --link: #7fb8f0;
    --c-comment: #7a8594;
    --c-note: #e0ae4a;
    --c-label: #7fc4ff;
    --c-op: #e59bd0;
    --c-arg: #d8dee6;
    --c-num: #8fd19e;
    --hl: #2b2a1a;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015;
  --panel: #131820;
  --panel-2: #1a2029;
  --line: #262e3a;
  --text: #d8dee6;
  --muted: #8994a2;
  --accent: #e0ae4a;
  --accent-soft: #2e2716;
  --link: #7fb8f0;
  --c-comment: #7a8594;
  --c-note: #e0ae4a;
  --c-label: #7fc4ff;
  --c-op: #e59bd0;
  --c-arg: #d8dee6;
  --c-num: #8fd19e;
  --hl: #2b2a1a;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input { font: inherit; color: inherit; }

/* Top bar */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  height: 52px; padding: 0 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: inset -3px -2px 0 rgba(0,0,0,.18); }
.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tabs a {
  padding: 5px 10px; border-radius: 6px; color: var(--muted);
  font-family: "IBM Plex Mono", monospace; font-size: 13px;
}
.tabs a:hover { background: var(--panel-2); text-decoration: none; }
.tabs a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.pagejump { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.pagejump input {
  width: 70px; padding: 4px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg);
}
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px;
  background: transparent; cursor: pointer; color: var(--muted);
}
.iconbtn:hover { color: var(--text); background: var(--panel-2); }
#menuBtn { display: none; }

/* Home */
.home { max-width: 980px; margin: 0 auto; padding: 56px 16px 80px; }
.home h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.01em; }
.home .lede { font-size: 18px; color: var(--muted); max-width: 680px; margin: 0 0 36px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.card {
  display: block; padding: 22px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
.card .kicker { font: 600 12px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.card h2 { margin: 6px 0 4px; font: 600 24px "IBM Plex Mono", monospace; }
.card p { margin: 0 0 14px; color: var(--muted); }
.card .go { font-weight: 500; color: var(--link); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-top: 48px; }
.facts h3 { margin: 0 0 4px; font-size: 14px; }
.facts p { margin: 0; color: var(--muted); font-size: 14px; }
.legend { margin-top: 48px; padding: 16px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.legend h3 { margin: 0 0 10px; font-size: 14px; }
.legend pre { margin: 0; font: 13px/1.6 "IBM Plex Mono", monospace; overflow-x: auto; tab-size: 8; }
.foot { margin-top: 48px; font-size: 13px; color: var(--muted); }

/* Reader */
.reader { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 52px); }
.side {
  border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.side .filter { padding: 12px; border-bottom: 1px solid var(--line); }
.side .filter input {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg);
}
.toc { overflow-y: auto; padding: 6px 0 24px; }
.toc .grp {
  padding: 14px 14px 4px; font: 600 11px "IBM Plex Mono", monospace;
  letter-spacing: .08em; color: var(--muted);
}
.toc a {
  display: flex; gap: 8px; justify-content: space-between;
  padding: 4px 14px; color: var(--text);
  font: 12.5px/1.4 "IBM Plex Mono", monospace;
  border-left: 3px solid transparent;
}
.toc a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc a .pp { color: var(--muted); flex: none; font-size: 11px; }
.toc a:hover { background: var(--panel-2); text-decoration: none; }
.toc a[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.main { position: relative; overflow: auto; min-width: 0; }
.filehead {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;
  padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.filehead h1 { margin: 0; font: 600 16px "IBM Plex Mono", monospace; word-break: break-all; }
.filehead .meta { color: var(--muted); font-size: 13px; }
.filehead .links { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
.code {
  margin: 0; padding: 12px 0 40px;
  font: 13px/1.6 "IBM Plex Mono", ui-monospace, monospace;
  tab-size: 8; -moz-tab-size: 8;
}
.ln { display: flex; min-width: max-content; }
.ln:hover { background: var(--panel-2); }
.ln.hl { background: var(--hl); }
.ln .n {
  flex: none; width: 64px; padding-right: 16px; text-align: right;
  color: var(--muted); opacity: .6; user-select: none;
}
.ln .n:hover { opacity: 1; text-decoration: none; }
.ln .t { white-space: pre; padding-right: 24px; }
.c { color: var(--c-comment); }
.note { color: var(--c-note); font-style: italic; }
.lab { color: var(--c-label); font-weight: 600; }
.op { color: var(--c-op); }
.arg { color: var(--c-arg); }
.num { color: var(--c-num); }
.page {
  display: flex; align-items: center; gap: 12px; min-width: 100%;
  margin: 18px 0 6px; padding: 0 20px 0 0; color: var(--accent);
  font: 600 11px "IBM Plex Mono", monospace; letter-spacing: .08em;
}
.page::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.page .n { width: 64px; padding-right: 16px; text-align: right; color: var(--muted); opacity: .6; font-weight: 400; letter-spacing: 0; }
.status { padding: 40px 20px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; padding: 0 20px 40px; font: 13px "IBM Plex Mono", monospace; }

@media (max-width: 820px) {
  #menuBtn { display: inline-flex; }
  .tabs { margin-left: 0; }
  .pagejump span { display: none; }
  .reader { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 30; top: 52px; bottom: 0; left: 0; width: min(320px, 86vw);
    transform: translateX(-100%); transition: transform .2s;
  }
  body.menu-open .side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .ln .n, .page .n { width: 48px; padding-right: 10px; }
  .filehead { padding: 10px 16px; }
  .filehead .links { margin-left: 0; }
}
@media (max-width: 520px) {
  .bar { gap: 8px; padding: 0 12px; }
  .brand .full, .brand > span:last-child { display: none; }
  .tabs a { padding: 4px 6px; font-size: 12px; }
  .bar a.iconbtn { display: none; }
  .pagejump input { width: 52px; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="iconbtn" id="menuBtn" aria-label="Files" title="Files">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/"><span class="dot"></span><span>AGC<span class="full"> Source</span></span></a>
  <nav class="tabs">
    <a href="#/Comanche055" data-prog="Comanche055">Comanche055</a>
    <a href="#/Luminary099" data-prog="Luminary099">Luminary099</a>
  </nav>
  <div class="spacer"></div>
  <form class="pagejump" id="pageForm" hidden>
    <label for="pageInput"><span>Page</span></label>
    <input id="pageInput" inputmode="numeric" placeholder="731" autocomplete="off">
  </form>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  <a class="iconbtn" href="https://github.com/zkm/Apollo-11" aria-label="GitHub repository" title="GitHub repository">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
  </a>
</header>

<div id="app"></div>

<template id="homeTpl">
  <main class="home">
    <h1>Apollo 11 Guidance Computer source code</h1>
    <p class="lede">The original assembly language that flew the Command Module and the Lunar Module in July 1969, transcribed from MIT printouts. Pick a program to read it in assembly order, page by page.</p>
    <div class="cards">
      <a class="card" href="#/Comanche055">
        <div class="kicker">Command Module · Columbia</div>
        <h2>Comanche055</h2>
        <p>Colossus 2A. Navigation, guidance and re-entry for the spacecraft that orbited the Moon and brought the crew home.</p>
        <span class="go">Read the source →</span>
      </a>
      <a class="card" href="#/Luminary099">
        <div class="kicker">Lunar Module · Eagle</div>
        <h2>Luminary099</h2>
        <p>Luminary 1A. Powered descent, landing and ascent, including the famous 1202 alarm handling and BURN, BABY, BURN.</p>
        <span class="go">Read the source →</span>
      </a>
    </div>
    <div class="facts">
      <div><h3>Assembly order</h3><p>Files are listed the way <code>MAIN.agc</code> includes them, grouped by the original tape libraries.</p></div>
      <div><h3>Printout pages</h3><p>Each file is marked with the page numbers of the original listing. Use the page box to jump to any page.</p></div>
      <div><h3>Linkable lines</h3><p>Click a line number to get a link to that exact line.</p></div>
    </div>
    <div class="legend">
      <h3>Reading the code</h3>
<pre><span class="lab">P63LM</span>		<span class="op">TC</span>	<span class="arg">PHASCHNG</span>		<span class="c"># original comment from the 1969 listing</span>
<span class="note">## Annotation added by the transcription team</span>
<span class="c"># Page 731  marks where a printout page begins</span></pre>
    </div>
    <p class="foot">Source: <a href="https://github.com/chrislgarry/Apollo-11">chrislgarry/Apollo-11</a>, transcribed by the <a href="https://www.ibiblio.org/apollo/">Virtual AGC</a> project from scans by the MIT Museum. Public domain.</p>
  </main>
</template>

<script>
(function () {
  'use strict';

  const REPO = 'zkm/Apollo-11';
  const BRANCH = 'master';
  const RAW = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/';
  const GH = 'https://github.com/' + REPO + '/blob/' + BRANCH + '/';
  const PROGRAMS = ['Comanche055', 'Luminary099'];

  const app = document.getElementById('app');
  const pageForm = document.getElementById('pageForm');
  const pageInput = document.getElementById('pageInput');
  const textCache = new Map();
  const tocCache = new Map();
  let shown = { prog: null, file: null };

  // ---------- theme ----------
  const root = document.documentElement;
  try {
    const saved = localStorage.getItem('agc-theme');
    if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
  } catch (e) { /* storage unavailable */ }
  document.getElementById('themeBtn').addEventListener('click', function () {
    const dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('agc-theme', root.dataset.theme); } catch (e) { /* ignore */ }
  });

  document.getElementById('menuBtn').addEventListener('click', function () {
    document.body.classList.toggle('menu-open');
  });

  // ---------- data ----------
  function fetchText(path) {
    if (!textCache.has(path)) {
      textCache.set(path, fetch(RAW + path).then(function (r) {
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        return r.text();
      }).catch(function (err) {
        textCache.delete(path);
        throw err;
      }));
    }
    return textCache.get(path);
  }

  // Parse MAIN.agc into groups of included files with their printout page ranges.
  function loadToc(prog) {
    if (!tocCache.has(prog)) {
      tocCache.set(prog, fetchText(prog + '/MAIN.agc').then(function (text) {
        const groups = [];
        let group = { name: 'MAIN', files: [{ file: 'MAIN.agc', pages: '', from: null, to: null }] };
        groups.push(group);
        text.split('\n').forEach(function (line) {
          const inc = line.match(/^\$(\S+\.agc)\s*(?:#\s*(.*))?$/);
          if (inc) {
            const pages = (inc[2] || '').trim();
            const nums = (pages.match(/\d+/g) || []).map(Number);
            group.files.push({
              file: inc[1],
              pages: pages.replace(/^pp?\.\s*/, ''),
              from: nums.length ? nums[0] : null,
              to: nums.length ? nums[nums.length - 1] : null
            });
            return;
          }
          const head = line.match(/^#\s+([A-Z][A-Z0-9_]*)\s*$/);
          if (head) {
            group = { name: head[1], files: [] };
            groups.push(group);
          }
        });
        const files = [];
        groups.forEach(function (g) { g.files.forEach(function (f) { files.push(f); }); });
        return { groups: groups.filter(function (g) { return g.files.length; }), files: files };
      }));
    }
    return tocCache.get(prog);
  }

  // ---------- highlighting ----------
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlightCode(code) {
    // AGC layout (tabs at 8): label at column 0, opcode at 16, operand(s) at 24.
    // Unlabeled lines starting at column 24 are operand-only continuation lines
    // of interpretive code, so their first token is an operand, not an opcode.
    const parts = code.split(/(\s+)/);
    let out = '';
    let col = 0;
    let field = /^\s/.test(code) ? 1 : 0;
    parts.forEach(function (p) {
      if (!p) return;
      if (/^\s+$/.test(p)) {
        for (let i = 0; i < p.length; i++) col = p[i] === '\t' ? col + 8 - (col % 8) : col + 1;
        out += p;
        return;
      }
      if (field === 1 && col >= 24 && /^\s/.test(code)) field = 2;
      col += p.length;
      const e = esc(p);
      if (field === 0) out += '<span class="lab">' + e + '</span>';
      else if (field === 1) out += '<span class="op">' + e + '</span>';
      else if (/^[-+]?\d+(\.\d+)?[BDE]?-?\d*$/.test(p)) out += '<span class="num">' + e + '</span>';
      else out += '<span class="arg">' + e + '</span>';
      field++;
    });
    return out;
  }

  function highlightLine(line, prog, isMain) {
    if (/^\s*##/.test(line)) return '<span class="note">' + esc(line) + '</span>';
    if (/^\s*#/.test(line)) return '<span class="c">' + esc(line) + '</span>';
    if (isMain) {
      const inc = line.match(/^\$(\S+\.agc)(.*)$/);
      if (inc) {
        return '<a href="#/' + prog + '/' + encodeURIComponent(inc[1]) + '">$' + esc(inc[1]) + '</a>' +
          highlightLine(inc[2], prog, false);
      }
    }
    const hash = line.indexOf('#');
    const code = hash === -1 ? line : line.slice(0, hash);
    const comment = hash === -1 ? '' : line.slice(hash);
    return highlightCode(code) + (comment ? '<span class="c">' + esc(comment) + '</span>' : '');
  }

  function renderSource(text, prog, file) {
    const isMain = file === 'MAIN.agc';
    const lines = text.replace(/\n$/, '').split('\n');
    const out = [];
    lines.forEach(function (line, i) {
      const n = i + 1;
      const page = line.match(/^#\s*Page\s*(\d+)\s*$/);
      if (page) {
        out.push('<div class="page" id="p' + page[1] + '"><a class="n" href="#/' + prog + '/' +
          encodeURIComponent(file) + '/L' + n + '" id="L' + n + '">' + n + '</a>PAGE ' + page[1] + '</div>');
        return;
      }
      out.push('<div class="ln" id="L' + n + '"><a class="n" href="#/' + prog + '/' +
        encodeURIComponent(file) + '/L' + n + '">' + n + '</a><span class="t">' +
        highlightLine(line, prog, isMain) + '</span></div>');
    });
    return out.join('');
  }

  // ---------- routing ----------
  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
    const prog = PROGRAMS.indexOf(parts[0]) !== -1 ? parts[0] : null;
    return { prog: prog, file: prog ? (parts[1] || null) : null, anchor: prog ? (parts[2] || null) : null };
  }

  function setTabs(prog) {
    document.querySelectorAll('.tabs a').forEach(function (a) {
      a.setAttribute('aria-current', String(a.dataset.prog === prog));
    });
    pageForm.hidden = !prog;
  }

  function showHome() {
    shown = { prog: null, file: null };
    setTabs(null);
    document.title = 'Apollo 11 AGC Source';
    app.replaceChildren(document.getElementById('homeTpl').content.cloneNode(true));
    window.scrollTo(0, 0);
  }

  function ensureReader(prog) {
    if (shown.prog === prog && app.querySelector('.reader')) return Promise.resolve();
    shown = { prog: prog, file: null };
    app.innerHTML =
      '<div class="reader">' +
        '<aside class="side"><div class="filter"><input type="search" placeholder="Filter files" aria-label="Filter files"></div><nav class="toc"><div class="status">Loading…</div></nav></aside>' +
        '<main class="main"><div class="status">Loading…</div></main>' +
      '</div>';
    const toc = app.querySelector('.toc');
    const filter = app.querySelector('.filter input');
    return loadToc(prog).then(function (data) {
      toc.innerHTML = data.groups.map(function (g) {
        return '<div class="grp">' + esc(g.name) + '</div>' + g.files.map(function (f) {
          return '<a href="#/' + prog + '/' + encodeURIComponent(f.file) + '" data-file="' + esc(f.file) + '">' +
            '<span>' + esc(f.file.replace(/\.agc$/, '')) + '</span><span class="pp">' + esc(f.pages) + '</span></a>';
        }).join('');
      }).join('');
      filter.addEventListener('input', function () {
        const q = filter.value.trim().toLowerCase();
        toc.querySelectorAll('a').forEach(function (a) {
          a.hidden = q && a.dataset.file.toLowerCase().indexOf(q) === -1;
        });
        toc.querySelectorAll('.grp').forEach(function (g) {
          let el = g.nextElementSibling, any = false;
          while (el && el.tagName === 'A') { if (!el.hidden) any = true; el = el.nextElementSibling; }
          g.hidden = !any;
        });
      });
    }).catch(function (err) {
      toc.innerHTML = '<div class="status">Could not load the file list (' + esc(err.message) + ').</div>';
    });
  }

  function scrollToAnchor(anchor) {
    const main = app.querySelector('.main');
    app.querySelectorAll('.ln.hl').forEach(function (el) { el.classList.remove('hl'); });
    if (!anchor) { main.scrollTop = 0; return; }
    const target = document.getElementById(anchor);
    if (!target) { main.scrollTop = 0; return; }
    if (/^L\d+$/.test(anchor)) {
      const row = target.classList.contains('ln') ? target : target.closest('.page');
      if (row) row.classList.add('hl');
    }
    main.scrollTop = target.offsetTop - Math.round(main.clientHeight / 3);
  }

  function showFile(prog, file, anchor) {
    const main = app.querySelector('.main');
    app.querySelectorAll('.toc a').forEach(function (a) {
      const on = a.dataset.file === file;
      a.setAttribute('aria-current', String(on));
      if (on) a.scrollIntoView({ block: 'nearest' });
    });
    document.body.classList.remove('menu-open');
    if (shown.file === file) { scrollToAnchor(anchor); return; }
    shown.file = file;
    main.innerHTML = '<div class="status">Loading ' + esc(file) + '…</div>';
    Promise.all([fetchText(prog + '/' + file), loadToc(prog)]).then(function (res) {
      if (shown.prog !== prog || shown.file !== file) return;
      const data = res[1];
      const idx = data.files.findIndex(function (f) { return f.file === file; });
      const info = data.files[idx] || { pages: '' };
      const prev = data.files[idx - 1], next = data.files[idx + 1];
      const lineCount = res[0].replace(/\n$/, '').split('\n').length;
      document.title = file.replace(/\.agc$/, '') + ' · ' + prog;
      main.innerHTML =
        '<div class="filehead"><h1>' + esc(file) + '</h1>' +
          '<span class="meta">' + prog + (info.pages ? ' · pages ' + esc(info.pages) : '') + ' · ' + lineCount.toLocaleString() + ' lines</span>' +
          '<span class="links"><a href="' + GH + prog + '/' + encodeURIComponent(file) + '">GitHub</a><a href="' + RAW + prog + '/' + encodeURIComponent(file) + '">Raw</a></span></div>' +
        '<div class="code">' + renderSource(res[0], prog, file) + '</div>' +
        '<div class="pager">' +
          (prev ? '<a href="#/' + prog + '/' + encodeURIComponent(prev.file) + '">← ' + esc(prev.file) + '</a>' : '<span></span>') +
          (next ? '<a href="#/' + prog + '/' + encodeURIComponent(next.file) + '">' + esc(next.file) + ' →</a>' : '<span></span>') +
        '</div>';
      scrollToAnchor(anchor);
    }).catch(function (err) {
      if (shown.file === file) {
        shown.file = null;
        main.innerHTML = '<div class="status">Could not load ' + esc(file) + ' (' + esc(err.message) + ').</div>';
      }
    });
  }

  function route() {
    const r = parseHash();
    if (!r.prog) { showHome(); return; }
    setTabs(r.prog);
    ensureReader(r.prog).then(function () {
      if (r.file) { showFile(r.prog, r.file, r.anchor); return; }
      location.replace('#/' + r.prog + '/MAIN.agc');
    });
  }

  pageForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const n = parseInt(pageInput.value, 10);
    const prog = parseHash().prog;
    if (!prog || !n) return;
    loadToc(prog).then(function (data) {
      const hit = data.files.find(function (f) { return f.from !== null && n >= f.from && n <= f.to; });
      if (hit) {
        location.hash = '#/' + prog + '/' + encodeURIComponent(hit.file) + '/p' + n;
        pageInput.value = '';
        pageInput.blur();
      } else {
        pageInput.setCustomValidity('No page ' + n + ' in ' + prog);
        pageInput.reportValidity();
        setTimeout(function () { pageInput.setCustomValidity(''); }, 2000);
      }
    });
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
